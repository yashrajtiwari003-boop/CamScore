name: CamScore Multiplatform CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android Release (.aab & .apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Android Debug APK
        run: ./gradlew :androidApp:assembleDebug

      - name: Build Android Release Bundle (.aab)
        run: ./gradlew :androidApp:bundleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CamScore-Debug-APK
          path: androidApp/build/outputs/apk/debug/*.apk

      - name: Upload Release AAB (Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: CamScore-Release-AAB
          path: androidApp/build/outputs/bundle/release/*.aab

  build-ios:
    name: Build iOS XCFramework
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Assemble Shared XCFramework
        run: ./gradlew :shared:assembleSharedXCFramework

      - name: Upload iOS Framework
        uses: actions/upload-artifact@v4
        with:
          name: CamScore-iOS-XCFramework
          path: shared/build/XCFrameworks/release/*.xcframework
